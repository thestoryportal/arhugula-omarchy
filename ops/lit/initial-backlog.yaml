local_id: epic-memory
title: Deliver memory learning setup and release hardening
type: epic
topic: memory-hardening
labels: [memory, release]
description: |
  DESTINATION: The system retains full local conversation history with efficient
  retrieval, learns approved command/Whisper/TTS improvements, supports layered
  setup and candidate restore, and passes security/recovery release gates.

  MECHANISM: Store append-only history with frontmatter and source references,
  derive reviewable memory and datasets, promote candidates through pinned tests,
  and manage profiles, backups, pruning, recovery, and network restrictions.

  WHY: Long-running local agents need continuity, but improvements must remain
  observable, reversible, local, and subject to approval.
