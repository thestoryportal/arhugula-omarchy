local_id: epic-catalog
title: Build the capability catalog and local model gateway
type: epic
topic: catalog-gateway
labels: [platform, models]
description: |
  DESTINATION: The VM owns a versioned catalog of Omarchy, Hyprland, menu,
  custom-binding, application, and MCP capabilities while the Mac host provides
  authenticated local LLM and evaluator services with safe fallbacks.

  MECHANISM: Discover capabilities into a provenance-bearing catalog, retrieve
  bounded candidates for model requests, validate catalog versions in the VM,
  and manage providers through explicit manifests and candidate activation.

  WHY: Semantic voice, application control, agent orchestration, and evaluation
  require current capabilities without giving models unrestricted authority.
---
