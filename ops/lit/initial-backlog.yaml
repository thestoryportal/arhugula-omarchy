local_id: epic-foundation
title: Establish the Omarchy agent workspace control-plane foundation
type: epic
topic: control-plane
priority: 1
labels: [architecture, spine]
description: |
  DESTINATION: A clean project can boot the typed control-plane contracts,
  validate commands and results, persist correlated runtime events, and run the
  contract test suite. The destination is defined by the approved design at
  docs/superpowers/specs/2026-09-19-omarchy-agent-workspace-design.md.

  MECHANISM: Freeze process boundaries and stack choices, create versioned
  schemas and in-memory seams, then prove event ordering and explicit failure
  states before feature work begins.

  WHY: Every later voice, model, agent, and Omarchy slice must share one
  authority boundary and one testable contract surface.
---
local_id: arc-foundation-spine
title: Build the typed control-plane spine
type: feature
topic: control-plane
parent: epic-foundation
lane: spine
description: Define the repository layout, technology choices, schemas, dispatch seams, and event journal needed by every later slice.
---
local_id: unit-foundation-stack
title: Freeze implementation stack and repository boundaries
type: task
topic: control-plane
parent: arc-foundation-spine
labels: [spine]
description: Select language, process boundaries, transport, schema format, test runner, packaging, and persistence approach; create the minimal project layout and clean-checkout bootstrap; prove the bootstrap in a fresh temporary checkout.
---
local_id: unit-foundation-contracts
title: Define versioned command event and policy contracts
type: task
topic: control-plane
parent: arc-foundation-spine
labels: [spine]
description: Define typed commands, results, events, capabilities, policies, profiles, providers, errors, correlation identifiers, and version rules; test round-trip validation and rejection of unknown versions.
---
local_id: unit-foundation-runtime
title: Implement the in-memory control-plane core
type: task
topic: control-plane
parent: arc-foundation-spine
labels: [spine]
description: Implement dispatch, correlation, explicit success/failure/blocked/canceled/uncertain states, and deterministic fake executors; test all result states without external IO.
---
local_id: arc-foundation-circle
title: Reconcile and release the control-plane foundation
type: feature
topic: control-plane
parent: epic-foundation
lane: circle-back
labels: [circle-back]
description: Reconcile the contracts against the first implementation, remove duplicate authority, update the design specification, and prepare the foundation release.
---
local_id: unit-foundation-circle
title: Run the foundation circle-back and document decisions
type: chore
topic: control-plane
parent: arc-foundation-circle
labels: [circle-back]
description: Run the complete foundation test suite, capture decisions and learnings in LIT comments, update the durable design where reality changed it, and verify the clean release state.
---

local_id: epic-voice
title: Deliver safe Omarchy voice control and dictation
type: epic
topic: voice-core
priority: 1
labels: [vertical-slice, voice]
description: |
  DESTINATION: Home/End dictation and one-shot KP_EQUAL Omarchy commands work
  independently of an agent CLI, with semantic routing, spoken clarification,
  explicit confirmation, and no command speech leaking into focused apps.

  MECHANISM: Preserve the working Voxtype path, place adaptive command capture
  beside it, route through the typed policy/executor boundary, and record every
  interaction as an observable event.

  WHY: This is the first complete user-value slice and the proof that the
  control-plane architecture works for a real Omarchy interaction.
---
