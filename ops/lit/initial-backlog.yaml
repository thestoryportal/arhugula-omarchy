local_id: epic-integrations
title: Deliver Omarchy application integrations and MCP
type: epic
topic: integrations-mcp
labels: [integrations, security]
description: |
  DESTINATION: Omarchy voice and agents can use approved application actions and
  MCP resources/tools while preserving the VM policy boundary, provenance,
  verification, undo, and deny-by-default networking.

  MECHANISM: Use read-only resources, typed stable tools, and a policy-gated
  generic action tool; prefer native APIs/CLIs, then documented shortcuts, then
  explicitly enabled screen/OCR fallback.

  WHY: The workspace must control useful applications without becoming an
  unrestricted GUI automation or shell execution system.
---
